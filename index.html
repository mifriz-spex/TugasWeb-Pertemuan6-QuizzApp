<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif Multikategori</title>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Tombol Dark Mode Toggle -->
    <button id="theme-toggle" class="absolute top-4 right-4 md:top-8 md:right-8 p-2.5 rounded-full bg-white dark:bg-slate-800 shadow-md text-slate-500 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all border border-slate-200 dark:border-slate-700">
        <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <!-- Icon diatur oleh JS -->
        </svg>
    </button>

    <!-- Container Utama -->
    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl dark:shadow-2xl dark:ring-1 dark:ring-white/10 w-full max-w-3xl overflow-hidden relative transition-colors duration-300">
        
        <!-- ================= Laman Beranda (Kategori) ================= -->
        <div id="home-screen" class="p-6 md:p-10 fade-in">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight mb-3">Pilih Kategori Kuis</h1>
                <p class="text-slate-500 dark:text-slate-400">Uji pengetahuan Anda di berbagai bidang teknologi.</p>
            </div>
            
            <div id="category-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                <!-- Card Kategori akan di-render di sini oleh JavaScript -->
            </div>
        </div>

        <!-- ================= Laman Kuis Aktif ================= -->
        <div id="quiz-screen" class="hidden flex-col h-full fade-in">
            <!-- Header Kuis -->
            <div id="quiz-header" class="bg-indigo-600 dark:bg-indigo-700 text-white p-6 relative overflow-hidden transition-colors">
                <button id="back-btn" class="absolute top-4 left-4 p-2 text-white/80 hover:text-white hover:bg-white/10 rounded-full transition-colors flex items-center text-sm font-medium">
                    ← Kembali
                </button>
                <div class="mt-6 text-center">
                    <h2 id="quiz-title" class="text-2xl font-bold">Judul Kuis</h2>
                    <p id="quiz-desc" class="text-indigo-200 text-sm mt-1">Deskripsi</p>
                </div>
            </div>

            <div class="p-6 md:p-8">
                <!-- Status Bar -->
                <div class="flex justify-between items-center mb-8 text-sm font-semibold">
                    <div id="progress" class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-4 py-1.5 rounded-full border border-slate-200 dark:border-slate-600">Soal 1/5</div>
                    <div class="flex items-center gap-1.5 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-500 px-4 py-1.5 rounded-full border border-yellow-200 dark:border-yellow-700/50">
                        <span>High Score: <span id="current-highscore">0</span>%</span>
                    </div>
                </div>

                <!-- Pertanyaan -->
                <h3 id="question" class="text-xl md:text-2xl font-bold mb-8 text-slate-800 dark:text-slate-100 leading-snug">Memuat soal...</h3>

                <!-- Pilihan Jawaban -->
                <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                    <!-- Tombol di-render JS -->
                </div>

                <div class="flex justify-end">
                    <button id="nextBtn" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                        Lanjut →
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= Laman Hasil Akhir ================= -->
        <div id="result-screen" class="hidden p-8 md:p-12 text-center fade-in">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 dark:bg-green-900/30 rounded-full mb-6">
                <span class="text-4xl">🏆</span>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 dark:text-white mb-2">Kuis Selesai!</h2>
            <div class="my-8 bg-slate-50 dark:bg-slate-700/50 p-6 rounded-2xl border border-slate-100 dark:border-slate-700">
                <p class="text-slate-500 dark:text-slate-400 mb-2 font-medium">Skor Akhir Anda</p>
                <div class="text-5xl font-extrabold text-indigo-600 dark:text-indigo-400 mb-3" id="score-text">0/5 (0%)</div>
                <p id="highscore-feedback" class="text-emerald-600 dark:text-emerald-400 font-semibold text-lg"></p>
            </div>
            
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button id="restartBtn" class="bg-indigo-100 dark:bg-indigo-900/40 hover:bg-indigo-200 dark:hover:bg-indigo-800/60 text-indigo-700 dark:text-indigo-300 font-semibold py-3 px-8 rounded-xl transition duration-200">
                    Coba Kategori Ini Lagi
                </button>
                <button id="homeBtn" class="bg-slate-800 dark:bg-slate-100 hover:bg-slate-900 dark:hover:bg-white text-white dark:text-slate-900 font-semibold py-3 px-8 rounded-xl shadow-md transition duration-200">
                    Pilih Kategori Lain
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
