<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif TKJ</title>
    <style>
        /* Animasi transisi ringan */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden relative border border-slate-100">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 md:p-8 text-center relative overflow-hidden">
            <!-- Dekorasi background -->
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500 rounded-full opacity-50 blur-2xl"></div>
            <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-indigo-400 rounded-full opacity-50 blur-2xl"></div>
            
            <h1 class="text-2xl md:text-3xl font-bold relative z-10">Kuis Jaringan & Komputer (TKJ)</h1>
            <p class="text-indigo-200 mt-2 text-sm relative z-10">Uji pengetahuan jaringan, hardware, dan protokol Anda!</p>
        </div>

        <!-- Area Kuis -->
        <div id="quiz-content" class="p-6 md:p-8">
            <!-- Progress dan Highscore -->
            <div class="flex justify-between items-center mb-8 text-sm font-semibold text-slate-500">
                <div id="progress" class="bg-indigo-100 text-indigo-700 px-4 py-1.5 rounded-full shadow-sm border border-indigo-200">Soal 1/5</div>
                <div class="flex items-center gap-1.5 bg-yellow-50 text-yellow-700 px-4 py-1.5 rounded-full border border-yellow-200 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-500" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    <span>High Score: <span id="current-highscore">0</span>%</span>
                </div>
            </div>

            <!-- Pertanyaan -->
            <h2 id="question" class="text-xl md:text-2xl font-bold mb-8 text-slate-700 fade-in leading-relaxed">Memuat soal...</h2>

            <!-- Pilihan Jawaban (Event Delegation Target) -->
            <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <!-- Tombol pilihan akan di-render di sini oleh JavaScript -->
            </div>

            <!-- Tombol Navigasi -->
            <div class="flex justify-end">
                <button id="nextBtn" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-8 rounded-lg shadow-md hover:shadow-lg transition duration-200 fade-in flex items-center gap-2">
                    Lanjut 
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Area Hasil Akhir (Awalnya disembunyikan) -->
        <div id="result" class="hidden p-8 md:p-12 text-center fade-in">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Kuis Selesai!</h2>
            <div class="my-8 bg-slate-50 p-6 rounded-xl border border-slate-100">
                <p class="text-slate-500 mb-2 font-medium">Skor Akhir Anda</p>
                <div class="text-5xl font-extrabold text-indigo-600 mb-3" id="score-text">0/5 (0%)</div>
                <p id="highscore-feedback" class="text-green-600 font-semibold text-lg"></p>
            </div>
            
            <button id="restartBtn" class="w-full md:w-auto bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-10 rounded-lg shadow-md transition duration-200 inline-flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
            </svg>
            Coba Lagi
        </button>
    </div>
</div>

<!-- Entry point JavaScript Modular untuk Vite -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
